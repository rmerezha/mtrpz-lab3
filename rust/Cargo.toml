[package]
name = "speer-test"
version = "0.1.0"
edition = "2021"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
anyhow = "1.0.86"
axum = { version = "0.8.1", features = ["multipart"] }
axum-extra = { version = "0.10.0", features = ["typed-header"] }
deadpool-postgres = "0.14.1"
serde = { version = "1.0.197", features = ["derive"] }
tokio = { version = "1.37.0", features = ["macros", "rt-multi-thread","signal", "fs"] }
tokio-pg-mapper = "0.2.0"
tokio-pg-mapper-derive = "0.2.0"
tokio-postgres = { version = "0.7.10", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
postgres-types = { version = "0.2.6", features = ["derive"] }
utoipa = { version = "5.3.1", features = ["axum_extras", "uuid", "chrono", "preserve_order"] }
utoipa-rapidoc = { version = "6.0.0", features = ["axum"] }
uuid = { version = "1.15.1", features = ["serde", "v4"] }
chrono = { version = "0.4.40", features = ["serde"] }
tower-http = { version = "0.6.2", features = ["cors", "trace"] }
async-trait = "0.1.86"
rand = "0.9.0"
serde_json = "1.0.139"
thiserror = "2.0.11"
tracing = "0.1.41"
bcrypt = "0.17.0"
figment = { version = "0.10.19", features = ["toml", "env"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
headers = "0.4.0"
